# ── DriverLedger ui/ — Bun runtime configuration ────────
# AD-6: peer-dep resolution + forward-looking test coverage thresholds.

[install]
# Expo SDK packages declare conflicting peer ranges. Disabling peer
# resolution prevents non-deterministic installs across Bun versions.
peer = false

# Speeds up repeated installs when caches already exist locally.
[install.cache]
disable = false

# ── Test runner (Bun-native, used in Fase 7) ─────────────
# Forward-looking; no tests are written in this change.
# Gates Fase 7 once tests are added; declared here so new files
# cannot silently regress the floor.
[test]
coverageThreshold = { lines = 80, functions = 80, statements = 80, branches = 80 }
